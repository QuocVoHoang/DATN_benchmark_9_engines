<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Unified WASM benchmark</title>
    <style>
        body {
            font: 14px system-ui;
            background: #10151b;
            color: #e8eef5;
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 16px
        }

        button,
        input {
            padding: 10px;
            margin: 4px
        }

        button {
            cursor: pointer
        }

        .panel {
            background: #19232e;
            padding: 16px;
            border-radius: 10px;
            margin: 12px 0
        }

        progress {
            width: 100%;
            height: 20px
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 12px
        }

        th,
        td {
            border: 1px solid #394858;
            padding: 6px;
            text-align: right
        }

        th:first-child,
        td:first-child {
            text-align: left
        }

        .ok {
            color: #72e6a3
        }

        .bad {
            color: #ff9a9a
        }

        pre {
            white-space: pre-wrap
        }

        #video {
            display: none
        }
    </style>
</head>

<body>
    <nav><a href="/">Official Benchmark</a> <a href="/diagnostic/">Diagnostic</a></nav>
    <h1>Unified video benchmark</h1>
    <div class="panel"><input id="file" type="file" accept="video/*"><label>Warm-up <input id="warmup" type="number"
                min="0" value="5" step="1"></label><label>Measure <input id="measure" type="number" min="1" value="10"
                step="1"> </label><label>Rest <input id="rest" type="number" min="0" value="15" step="1">
            </label><button id="run" disabled>Run 9 engines</button><button id="stop" disabled>Stop</button><button
            id="json" disabled>Download JSON</button><button id="csv" disabled>Download CSV</button>
        <p id="meta">Choose one video.</p><progress id="progress" value="0" max="9"></progress>
        <p id="status">Idle</p>
    </div>
    <div class="panel">
        <table id="results">
            <thead>
                <tr>
                    <th>Engine</th>
                    <th>Status</th>
                    <th>Frames</th>
                    <th>FPS</th>
                    <th>Core Mean</th>
                    <th>Core P50</th>
                    <th>Core P95</th>
                    <th>Core P99</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div><video id="video" muted playsinline></video><canvas id="canvas" hidden></canvas>
    <script type="module" src="js/app.js"></script>
</body>

</html>
