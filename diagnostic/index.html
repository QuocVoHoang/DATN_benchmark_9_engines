<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Diagnostic benchmark</title><style>
body{font:14px system-ui;background:#10151b;color:#e8eef5;max-width:1100px;margin:30px auto;padding:0 16px}a{color:#8ecbff;margin-right:18px}button,input,select{padding:10px;margin:4px}button{cursor:pointer}.panel{background:#19232e;padding:16px;border-radius:10px;margin:12px 0}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #394858;padding:7px;text-align:right}th:first-child,td:first-child{text-align:left}.ok{color:#72e6a3}.bad{color:#ff9a9a}#video{display:none}
</style></head><body><nav><a href="/">Official Benchmark</a><a href="/diagnostic/">Diagnostic</a></nav><h1>Diagnostic benchmark</h1><div class="panel"><input id="file" type="file" accept="video/*"><select id="engine"></select><label>Warm-up <input id="warmup" type="number" min="0" value="5" step="1"> s</label><label>Measure <input id="measure" type="number" min="1" value="10" step="1"> s</label><button id="run">Run diagnostic</button><button id="stop" disabled>Stop</button><button id="downloadJson" disabled>Download JSON</button><button id="downloadCsv" disabled>Download CSV</button><p id="meta">Choose a video.</p><p id="status">Warm-up and measurement are configurable</p></div><div class="panel"><table><thead><tr><th>Engine</th><th>Status</th><th>Frames</th><th>FPS</th><th>Core Mean</th><th>Core P50</th><th>Core P95</th><th>Core P99</th></tr></thead><tbody id="results"></tbody></table></div><video id="video" muted playsinline></video><canvas id="canvas" hidden></canvas><script type="module" src="../js/diagnostic.js"></script></body></html>
